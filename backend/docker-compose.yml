version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autoquote_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: autoquote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: autoquote_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Questo ci permette di modificare il codice senza riavviare il container
    depends_on:
      - db

volumes:
  postgres_data:
