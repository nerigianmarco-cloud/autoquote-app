<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoQuote - Trova il meccanico migliore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased relative min-h-screen z-0">

    <!-- Sfondo Fotografico Trasparente (Sostituibile con i tuoi loghi) -->
    <!-- Ho usato opacity-[0.06] per un effetto delicatissimo e grayscale per renderlo elegante -->
    <div class="fixed inset-0 z-[-1] opacity-[0.08] grayscale mix-blend-multiply pointer-events-none" 
         style="background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1920&q=80'); 
                background-size: cover; 
                background-position: center;
                background-attachment: fixed;">
    </div>

    <!-- Header Professionale -->
    <header class="bg-slate-900 text-white pt-12 pb-20 px-6 rounded-b-[2.5rem] shadow-xl relative overflow-hidden">
        <div class="max-w-md mx-auto flex items-center justify-center gap-3 mb-2 relative z-10">
            <!-- Nuova Icona Profilo Auto Moderna -->
            <svg class="w-9 h-9 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 13.5V17a2 2 0 002 2h1a2 2 0 002-2v-1.5m10 0V17a2 2 0 002 2h1a2 2 0 002-2v-3.5"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 11l1.5-5h13L20 11H4z"></path>
                <circle cx="7.5" cy="14.5" r="1.5"></circle>
                <circle cx="16.5" cy="14.5" r="1.5"></circle>
            </svg>
            <h1 class="text-3xl font-bold tracking-tight">AutoQuote</h1>
        </div>
        <p class="text-center text-slate-400 text-sm font-medium relative z-10">Trasparenza e risparmio per la tua auto</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 -mt-12">
        
        <!-- Search Card -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-6 mb-8 border border-white/50">
            
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Targa Veicolo</label>
                <input type="text" placeholder="ES. AB 123 CD" class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase font-mono text-lg text-center bg-slate-50/50 transition-all placeholder:text-slate-300 placeholder:font-sans shadow-inner" />
            </div>

            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Intervento Richiesto</label>
                <div class="relative">
                    <select class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-slate-50/50 font-medium text-slate-700 transition-all cursor-pointer shadow-inner">
                        <option disabled selected>Seleziona l'intervento...</option>
                        <option>Tagliando Completo</option>
                        <option>Sostituzione Frizione</option>
                        <option>Cambio Pastiglie Freni</option>
                        <option>Kit Distribuzione</option>
                        <option>Ricarica Climatizzatore</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <button class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-4 px-4 rounded-xl transition-all duration-200 shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Confronta Preventivi
            </button>
        </div>

        <!-- Risultati Intestazione -->
        <div class="flex items-center justify-between mb-4 px-1">
            <h2 class="text-lg font-bold text-slate-800 backdrop-blur-sm bg-white/50 px-3 py-1 rounded-lg">Offerte Consigliate</h2>
            <span class="text-xs font-semibold text-slate-600 bg-white/80 shadow-sm px-2 py-1 rounded-full backdrop-blur-sm">2 risultati</span>
        </div>
        
        <!-- Risultato 1 (Miglior Prezzo) -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm hover:shadow-md transition-shadow p-5 mb-4 border border-white/50 relative overflow-hidden group cursor-pointer">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <h3 class="font-bold text-slate-900">Autofficina Rossi</h3>
                        <span class="bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wide">Miglior Prezzo</span>
                    </div>
                    <div class="flex items-center gap-3 text-sm text-slate-500 mb-2">
                        <span class="flex items-center gap-1"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg> 2.5 km</span>
                        <span class="flex items-center gap-1"><svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg> 4.8</span>
                    </div>
                    <p class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Disponibilità immediata
                    </p>
                </div>
                <div class="text-right flex flex-col justify-between h-full">
                    <p class="text-2xl font-bold text-slate-900">€ 280</p>
                </div>
            </div>
        </div>

        <!-- Risultato 2 (Premium) -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm hover:shadow-md transition-shadow p-5 mb-12 border border-white/50 relative overflow-hidden group cursor-pointer">
            <div class="absolute top-0 left-0 w-1 h-full bg-slate-300 group-hover:bg-slate-400 transition-colors"></div>
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <h3 class="font-bold text-slate-900">Garage Moderna</h3>
                    </div>
                    <div class="flex items-center gap-3 text-sm text-slate-500 mb-2">
                        <span class="flex items-center gap-1"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg> 4.1 km</span>
                        <span class="flex items-center gap-1"><svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg> 4.5</span>
                    </div>
                    <p class="text-xs text-slate-600 font-medium flex items-center gap-1">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Auto di cortesia inclusa
                    </p>
                </div>
                <div class="text-right flex flex-col justify-between h-full">
                    <p class="text-2xl font-bold text-slate-900">€ 310</p>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
