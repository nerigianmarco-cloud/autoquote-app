<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoQuote - Trova il meccanico migliore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        optgroup { font-weight: 900; color: #0f172a; background-color: #f1f5f9; padding: 5px; text-transform: uppercase; letter-spacing: 0.5px;}
        option { font-weight: 600; color: #334155; background-color: #ffffff; padding: 10px; text-transform: none;}
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased relative min-h-screen z-0">

    <!-- Sfondo Trasparente -->
    <div class="fixed inset-0 z-[-1] opacity-[0.20] pointer-events-none" 
         style="background-image: url('https://images.unsplash.com/photo-1614026480209-cd9934144671?auto=format&fit=crop&w=1920&q=80'); 
                background-size: cover; 
                background-position: center;
                background-attachment: fixed;">
    </div>

    <!-- Header ad Alto Impatto -->
    <header class="bg-slate-900 text-white pt-16 pb-20 px-6 rounded-b-[2.5rem] shadow-2xl relative overflow-hidden">
        <div class="max-w-md mx-auto text-center mb-3 relative z-10">
            <h1 class="text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-blue-400 via-blue-200 to-white drop-shadow-sm pb-1">
                AutoQuote
            </h1>
        </div>
        <p class="text-center text-slate-400 text-sm font-semibold relative z-10 tracking-widest uppercase">Trasparenza e risparmio</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 -mt-12">
        
        <!-- Search Card -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl p-6 mb-8 border border-white/50 relative z-20">
            
            <div class="mb-5">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Targa Veicolo</label>
                <input type="text" id="targa-input" placeholder="ES. AB 123 CD" class="w-full px-4 py-4 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase font-mono text-lg text-center bg-slate-50/50 transition-all placeholder:text-slate-300 placeholder:font-sans shadow-inner" />
                <p id="targa-error" class="text-red-500 text-xs font-bold mt-2 hidden text-center">Inserisci una targa valida!</p>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Intervento Richiesto</label>
                <div class="relative">
                    <select id="intervento-select" class="w-full px-4 py-4 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-slate-50/50 font-semibold text-slate-700 transition-all cursor-pointer shadow-inner">
                        <option value="" disabled selected>Seleziona l'intervento...</option>
                        
                        <optgroup label="📋 TAGLIANDI E REVISIONI">
                            <option value="tagliando">Tagliando Completo (Olio e Filtri)</option>
                            <option value="revisione">Revisione Ministeriale</option>
                            <option value="checkup">Check-up Pre-Partenza</option>
                        </optgroup>

                        <optgroup label="⚙️ MOTORE E SCARICO">
                            <option value="distribuzione">Kit Cinghia Distribuzione / Catena</option>
                            <option value="pompa_acqua">Sostituzione Pompa dell'Acqua</option>
                            <option value="fap">Pulizia FAP / Valvola EGR</option>
                            <option value="candele">Sostituzione Candele / Candelette</option>
                            <option value="marmitta">Sostituzione Silenziatore / Marmitta</option>
                        </optgroup>

                        <optgroup label="⚙️ TRASMISSIONE E FRIZIONE">
                            <option value="frizione">Sostituzione Frizione e Volano</option>
                            <option value="olio_cambio">Lavaggio e Olio Cambio Automatico</option>
                        </optgroup>

                        <optgroup label="🛞 FRENI E SOSPENSIONI">
                            <option value="freni_pastiglie">Sostituzione Pastiglie Freni</option>
                            <option value="freni_dischi">Sostituzione Dischi e Pastiglie</option>
                            <option value="ammortizzatori">Sostituzione Ammortizzatori</option>
                            <option value="braccetti">Sostituzione Braccetti / Testine</option>
                            <option value="convergenza">Convergenza ed Equilibratura</option>
                        </optgroup>

                        <optgroup label="🔌 ELETTRONICA E CLIMA">
                            <option value="clima">Ricarica Climatizzatore</option>
                            <option value="batteria">Sostituzione Batteria</option>
                            <option value="alternatore">Sostituzione Alternatore / Motorino Avviamento</option>
                            <option value="diagnosi">Diagnosi Elettronica Centralina</option>
                        </optgroup>

                        <optgroup label="✨ CRISTALLI E ALTRO">
                            <option value="parabrezza">Sostituzione Parabrezza</option>
                            <option value="lucidatura_fari">Lucidatura Fari Opacizzati</option>
                        </optgroup>

                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-slate-400">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
                <p id="error-msg" class="text-red-500 text-xs font-bold mt-2 hidden text-center">Seleziona un intervento prima di cercare!</p>
            </div>

            <button id="search-btn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-lg py-4 px-4 rounded-2xl transition-all duration-300 shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 overflow-hidden">
                <svg id="btn-spinner" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="btn-text">Confronta Preventivi</span>
            </button>
        </div>

        <!-- Box Targa Rilevata (Simulazione API Motorizzazione) -->
        <div id="car-detected" class="hidden mb-6 bg-slate-800 text-white rounded-2xl p-4 shadow-lg flex items-center gap-3 border border-slate-700 transition-all duration-500 translate-y-4 opacity-0">
            <div class="bg-blue-500/20 p-2 rounded-lg">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Veicolo Rilevato</p>
                <p id="car-model-text" class="font-bold text-lg">BMW Serie 3 (F30) 2.0d</p>
            </div>
        </div>

        <!-- Contenitore Risultati Dinamici -->
        <div id="results-container" class="hidden opacity-0 translate-y-8 transition-all duration-500 ease-out">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-lg font-bold text-slate-800 backdrop-blur-sm bg-white/50 px-3 py-1 rounded-xl">Offerte Consigliate</h2>
                <span class="text-xs font-bold text-slate-600 bg-white/80 shadow-sm px-3 py-1 rounded-full backdrop-blur-sm">2 risultati</span>
            </div>
            <div id="results-list"></div>
        </div>

    </main>

    <script>
        // Simulazione Listini (I prezzi futuri arriveranno dal backend in base al modello esatto)
        const databasePrezzi = {
            "tagliando": [{ nome: "Autofficina Rossi", prezzo: "220", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Olio specifico BMW", color: "blue" }, { nome: "Garage Moderna", prezzo: "250", badge: "", km: "4.1", rating: "4.5", note: "+ Auto di cortesia inclusa", color: "slate" }],
            "revisione": [{ nome: "Garage Moderna", prezzo: "79", badge: "Tariffa Fissa", km: "4.1", rating: "4.5", note: "✓ Pratica ministeriale inclusa", color: "blue" }],
            "checkup": [{ nome: "Autofficina Rossi", prezzo: "35", badge: "Promo", km: "2.5", rating: "4.8", note: "✓ 20 controlli visivi", color: "blue" }],
            "distribuzione": [{ nome: "Autofficina Rossi", prezzo: "650", badge: "Specialisti", km: "2.5", rating: "4.8", note: "✓ Catena originale BMW", color: "blue" }, { nome: "Garage Moderna", prezzo: "710", badge: "", km: "4.1", rating: "4.5", note: "+ Garanzia 24 mesi", color: "slate" }],
            "pompa_acqua": [{ nome: "Garage Moderna", prezzo: "180", badge: "", km: "4.1", rating: "4.5", note: "✓ Liquido radiatore incluso", color: "blue" }],
            "fap": [{ nome: "Autofficina Rossi", prezzo: "250", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Lavaggio chimico FAP", color: "blue" }],
            "candele": [{ nome: "Autofficina Rossi", prezzo: "120", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Candelette Bosch", color: "blue" }],
            "marmitta": [{ nome: "Garage Moderna", prezzo: "190", badge: "", km: "4.1", rating: "4.5", note: "✓ Terminale omologato", color: "blue" }],
            "frizione": [{ nome: "Autofficina Rossi", prezzo: "850", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Kit frizione + Volano bimassa", color: "blue" }],
            "olio_cambio": [{ nome: "Garage Moderna", prezzo: "350", badge: "Specialisti", km: "4.1", rating: "4.5", note: "✓ Lavaggio ZF 8 Marce", color: "blue" }],
            "freni_pastiglie": [{ nome: "Autofficina Rossi", prezzo: "130", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Sensori usura inclusi", color: "blue" }],
            "freni_dischi": [{ nome: "Autofficina Rossi", prezzo: "380", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Dischi ventilati Brembo", color: "blue" }],
            "ammortizzatori": [{ nome: "Garage Moderna", prezzo: "550", badge: "Consigliato", km: "4.1", rating: "4.5", note: "✓ Bilstein B4", color: "blue" }],
            "braccetti": [{ nome: "Autofficina Rossi", prezzo: "280", badge: "", km: "2.5", rating: "4.8", note: "✓ Silent block inclusi", color: "blue" }],
            "convergenza": [{ nome: "Autofficina Rossi", prezzo: "50", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Controllo laser 3D", color: "blue" }],
            "clima": [{ nome: "Autofficina Rossi", prezzo: "70", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Gas R134a + Igienizzazione", color: "blue" }],
            "batteria": [{ nome: "Garage Moderna", prezzo: "210", badge: "", km: "4.1", rating: "4.5", note: "✓ Batteria AGM per Start&Stop", color: "blue" }],
            "alternatore": [{ nome: "Autofficina Rossi", prezzo: "450", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Rigenerato garantito", color: "blue" }],
            "diagnosi": [{ nome: "Autofficina Rossi", prezzo: "30", badge: "Rapido", km: "2.5", rating: "4.8", note: "✓ Stampa e reset errori", color: "blue" }],
            "parabrezza": [{ nome: "Garage Moderna", prezzo: "420", badge: "", km: "4.1", rating: "4.5", note: "✓ Calibrazione ADAS inclusa", color: "blue" }],
            "lucidatura_fari": [{ nome: "Autofficina Rossi", prezzo: "60", badge: "Miglior Prezzo", km: "2.5", rating: "4.8", note: "✓ Applicazione trasparente UV", color: "blue" }]
        };

        document.addEventListener('DOMContentLoaded', function() {
            const searchBtn = document.getElementById('search-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const resultsContainer = document.getElementById('results-container');
            const resultsList = document.getElementById('results-list');
            const selectIntervento = document.getElementById('intervento-select');
            const targaInput = document.getElementById('targa-input');
            const errorMsg = document.getElementById('error-msg');
            const targaError = document.getElementById('targa-error');
            const carDetectedBox = document.getElementById('car-detected');
            const carModelText = document.getElementById('car-model-text');

            searchBtn.addEventListener('click', function() {
                const tipoIntervento = selectIntervento.value;
                const targa = targaInput.value.trim();

                // Validazione form
                let hasError = false;
                if (!targa) {
                    targaError.classList.remove('hidden');
                    hasError = true;
                } else {
                    targaError.classList.add('hidden');
                }

                if (!tipoIntervento) {
                    errorMsg.classList.remove('hidden');
                    hasError = true;
                } else {
                    errorMsg.classList.add('hidden');
                }

                if (hasError) return;

                // Animazione di ricerca (Simulazione API Motorizzazione + Ricerca Database)
                searchBtn.disabled = true;
                searchBtn.classList.add('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Interrogazione Motorizzazione...';
                btnSpinner.classList.remove('hidden');
                
                resultsContainer.classList.add('opacity-0', 'translate-y-8');
                carDetectedBox.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => { carDetectedBox.classList.add('hidden'); resultsContainer.classList.add('hidden'); }, 300);
                
                // Simula il tempo di risposta dell'API Targa
                setTimeout(() => {
                    // Logica finta: se la targa finisce con Fiat (o è corta), mostra Panda, altrimenti BMW.
                    if (targa.toUpperCase().includes('FIAT') || targa.length < 5) {
                        carModelText.textContent = "Fiat Panda 1.2 Fire (69cv)";
                    } else {
                        carModelText.textContent = "BMW Serie 3 (F30) 2.0 Diesel";
                    }

                    // Mostra il veicolo rilevato
                    carDetectedBox.classList.remove('hidden');
                    setTimeout(() => {
                        carDetectedBox.classList.remove('opacity-0', 'translate-y-4');
                    }, 50);

                    btnText.textContent = 'Calcolo listini ufficiali...';

                    // Simula il calcolo dei prezzi
                    setTimeout(() => {
                        searchBtn.disabled = false;
                        searchBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                        btnText.textContent = 'Aggiorna Preventivi';
                        btnSpinner.classList.add('hidden');

                        const offerte = databasePrezzi[tipoIntervento] || [];
                        let htmlCard = '';

                        offerte.forEach((off, index) => {
                            const borderColor = index === 0 ? 'bg-blue-500' : 'bg-slate-300 group-hover:bg-slate-400';
                            const noteColor = index === 0 ? 'text-emerald-600' : 'text-slate-600';
                            
                            let badgeHtml = '';
                            if (off.badge) {
                                badgeHtml = `<span class="bg-${off.color}-100 text-${off.color}-700 text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide">${off.badge}</span>`;
                            }

                            htmlCard += `
                            <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-sm hover:shadow-md transition-shadow p-5 mb-4 border border-white/50 relative overflow-hidden group cursor-pointer">
                                <div class="absolute top-0 left-0 w-1.5 h-full ${borderColor} transition-colors"></div>
                                <div class="flex justify-between items-start pl-2">
                                    <div>
                                        <div class="flex items-center gap-2 mb-1">
                                            <h3 class="font-bold text-slate-900 text-lg">${off.nome}</h3>
                                            ${badgeHtml}
                                        </div>
                                        <div class="flex items-center gap-3 text-sm text-slate-500 mb-2">
                                            <span class="flex items-center gap-1 font-medium">📍 ${off.km} km</span>
                                            <span class="flex items-center gap-1 font-medium">⭐ ${off.rating}</span>
                                        </div>
                                        <p class="text-xs ${noteColor} font-bold flex items-center gap-1">
                                            ${off.note}
                                        </p>
                                    </div>
                                    <div class="text-right flex flex-col justify-between h-full">
                                        <p class="text-2xl font-black text-slate-900">€ ${off.prezzo}</p>
                                    </div>
                                </div>
                            </div>`;
                        });

                        resultsList.innerHTML = htmlCard;
                        resultsContainer.classList.remove('hidden');
                        setTimeout(() => {
                            resultsContainer.classList.remove('opacity-0', 'translate-y-8');
                        }, 50);

                    }, 1000); // Secondo ritardo (database)

                }, 1200); // Primo ritardo (API Targa)
            });
        });
    </script>
</body>
</html>
