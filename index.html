<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoQuote - Trova il meccanico migliore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-6 shadow-md rounded-b-3xl">
        <h1 class="text-3xl font-bold text-center">AutoQuote 🛠️</h1>
        <p class="text-center mt-2 text-blue-100">Trova l'officina più conveniente per la tua auto</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto mt-8 p-4">
        
        <!-- Search Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">La tua Targa</label>
                <input type="text" placeholder="Es. AB123CD" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase font-mono text-lg text-center" />
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Di cosa hai bisogno?</label>
                <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option disabled selected>Seleziona l'intervento...</option>
                    <option>Tagliando completo</option>
                    <option>Sostituzione Frizione</option>
                    <option>Cambio Pastiglie Freni</option>
                    <option>Distribuzione</option>
                    <option>Ricarica Aria Condizionata</option>
                </select>
            </div>

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                Cerca Prezzi
            </button>
        </div>

        <!-- Mockup Risultati (Inizialmente nascosti, qui visibili per il design) -->
        <h2 class="text-xl font-bold mb-4 text-gray-700">Migliori offerte vicino a te</h2>
        
        <!-- Risultato 1 -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 border-l-4 border-green-500 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-lg">Autofficina Rossi</h3>
                <p class="text-sm text-gray-500">📍 2.5 km da te • ⭐ 4.8</p>
                <p class="text-xs text-green-600 font-semibold mt-1">Disponibilità immediata</p>
            </div>
            <div class="text-right">
                <p class="text-2xl font-bold text-gray-800">€ 280</p>
                <button class="text-sm text-blue-600 font-bold mt-1">Prenota</button>
            </div>
        </div>

        <!-- Risultato 2 -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 border-l-4 border-yellow-500 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-lg">Garage Moderna</h3>
                <p class="text-sm text-gray-500">📍 4.1 km da te • ⭐ 4.5</p>
                <p class="text-xs text-yellow-600 font-semibold mt-1">Auto di cortesia inclusa</p>
            </div>
            <div class="text-right">
                <p class="text-2xl font-bold text-gray-800">€ 310</p>
                <button class="text-sm text-blue-600 font-bold mt-1">Prenota</button>
            </div>
        </div>

    </main>

</body>
</html>
